[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit level testing with testing tactics (BVA, Equivalence Partitioning)
    integration: Integration testing between backend services and database
    system: End-to-end System testing across user journeys and clean account rules
    selenium: Selenium browser automation testing
